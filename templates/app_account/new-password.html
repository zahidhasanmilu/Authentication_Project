<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password</title>
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/5.3.0/css/bootstrap.min.css">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

  <style>
    body {
        background-color: #f8f9fa;
    }
    .container {
        max-width: 400px;
        margin-top: 100px;
        background: #ffffff;
        padding: 20px;
        border-radius: 8px;
        box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
    }
    .btn-custom {
        background-color: #007bff;
        color: white;
    }
    .btn-custom:hover {
        background-color: #0056b3;
    }
  </style>
</head>
<body>

  <div class="container">
    <h3 class="text-center mb-4">Set New Password</h3>
    
    <form method="POST">
        {% csrf_token %}
        
        <div class="mb-3">
            <label for="password1" class="form-label">New Password</label>
            <input type="password" name="new_password1" id="password1" class="form-control" placeholder="Enter new password" required>
        </div>

        <div class="mb-3">
            <label for="password2" class="form-label">Confirm Password</label>
            <input type="password" name="new_password2" id="password2" class="form-control" placeholder="Confirm your password" required>
        </div>

        <button type="submit" class="btn btn-custom w-100">Reset Password</button>
    </form>
  </div>

</body>
</html>
